spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: PUBLIC
    show-sql: false
  sql:
    init:
      mode: never

app:
  academic-structure-seeding:
    # AcademicStructureBootSeeder: loads the matrix from classpath:academic-structure
    # through the real load service. Regression/CI bootstrap only — production has
    # no seeder; structure arrives via POST /api/v1/academic-structure/load.
    enabled: true
  academic-data:
    source: classpath
  catalog-seeding:
    enabled: false
  admin-bootstrap:
    enabled: true
    email: admin@tests.local
    password: AdminPassw0rd!
  jwt:
    secret: testSecretForTestingOnlyMustBe32BytesLong!
    expiration-ms: 86400000

server:
  port: 8080