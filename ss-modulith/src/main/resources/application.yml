spring:
  application:
    name: study-shield

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyshield}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 180000
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          timeout: 10000
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: public, content, user_, quiz, tv
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  security:
    jwt:
      secret: ${JWT_SECRET:defaultSecretForDevelopmentOnly32chars!}

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretForDevelopmentOnly32chars!}
    expiration-ms: 86400000

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
